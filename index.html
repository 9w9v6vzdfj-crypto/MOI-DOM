<style>
/* ==========================================================================
   RESET & VARIABILI PREMIUM (Toni Prugna, Cipria, Oro Satinato & Trasparenze)
   ========================================================================== */
:root {
  --plum: #3d1a2e;
  --plum-light: #52253f;
  --plum-opaque: rgba(61, 26, 46, 0.08);
  --rose: #e8c5c8;
  --rose-light: #f9f0f1;
  --cream: #fdf6f0;
  --gold: #c5a880;
  --gold-dark: #a4865d;
  --white: #ffffff;
  --text-dark: #2c1824;
  --text-muted: #8a7481;
  --shadow-sm: 0 4px 12px rgba(61, 26, 46, 0.04);
  --shadow-md: 0 12px 24px rgba(61, 26, 46, 0.08);
  --shadow-lg: 0 20px 40px rgba(61, 26, 46, 0.12);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-serif: 'Playfair Display', serif;
  --font-sans: 'DM Sans', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-sans);
  background-color: var(--cream);
  color: var(--text-dark);
  line-height: 1.5;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ==========================================================================
   LAYOUT GENERALE & NAVIGAZIONE (App-Like)
   ========================================================================== */
#app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

header {
  background: var(--white);
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--plum-opaque);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}

.logo-area h1 {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--plum);
  letter-spacing: 0.5px;
}

.logo-area span {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--gold-dark);
  display: block;
}

.user-badge {
  background: var(--plum-opaque);
  padding: 6px 14px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  font-weight: 600;
  color: var(--plum);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Barra di navigazione inferiore stile iOS */
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-around;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--plum-opaque);
  z-index: 90;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.03);
}

nav button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  width: 20%;
  transition: var(--transition);
}

nav button i, nav button span.nav-icon {
  font-size: 20px;
  transition: var(--transition);
}

nav button.active {
  color: var(--plum);
  font-weight: 700;
}

nav button.active span.nav-icon {
  transform: translateY(-2px);
  filter: drop-shadow(0 2px 4px rgba(61, 26, 46, 0.15));
}

main {
  flex: 1;
  padding: 20px 16px calc(90px + env(safe-area-inset-bottom, 0px));
  max-width: 1200px;
  margin: 0 auto;
  width: 100%;
}

/* ==========================================================================
   COMPONENTI: BOTTONI & SELETTORI
   ========================================================================== */
button.btn-primary {
  background: linear-gradient(135deg, var(--plum), var(--plum-light));
  color: var(--white);
  border: none;
  padding: 12px 22px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(61, 26, 46, 0.2);
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button.btn-primary:active {
  transform: scale(0.96);
  box-shadow: 0 2px 8px rgba(61, 26, 46, 0.2);
}

button.btn-secondary {
  background: var(--white);
  color: var(--plum);
  border: 1px solid var(--plum-opaque);
  padding: 12px 22px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

button.btn-secondary:active {
  background: var(--plum-opaque);
}

/* ==========================================================================
   CONTROLLI DATA & FILTRI (HEADER CALENDARIO)
   ========================================================================== */
.calendar-controls {
  background: var(--white);
  padding: 14px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.date-scroller {
  display: flex;
  align-items: center;
  gap: 12px;
}

.date-scroller span {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--plum);
  min-width: 110px;
  text-align: center;
}

.btn-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--plum-opaque);
  border: none;
  color: var(--plum);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  transition: var(--transition);
}

.btn-circle:active {
  transform: scale(0.9);
  background: var(--rose);
}

/* ==========================================================================
   LA NUOVA GRIGLIA ORARIA (EFFETTO SOSPESO)
   ========================================================================== */
.calendar-grid {
  display: flex;
  background: var(--white);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow-x: auto;
  position: relative;
  border: 1px solid rgba(61, 26, 46, 0.04);
}

/* Colonna ore di sinistra */
.time-column {
  width: 55px;
  flex-shrink: 0;
  background: var(--white);
  border-right: 1px solid var(--plum-opaque);
  position: sticky;
  left: 0;
  z-index: 10;
}

.time-header {
  height: 50px;
  border-bottom: 2px solid var(--plum-opaque);
  background: var(--white);
}

.time-slot-label {
  height: 48px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  padding-top: 4px;
}

/* Colonne dei dipendenti */
.columns-container {
  display: flex;
  flex-grow: 1;
}

.staff-column {
  flex: 1;
  min-width: 145px;
  border-right: 1px solid rgba(61, 26, 46, 0.05);
  position: relative;
  background-image: linear-gradient(rgba(61, 26, 46, 0.03) 1px, transparent 1px);
  background-size: 100% 24px; /* Linee soft ogni 15/30 min */
}

.staff-header {
  height: 50px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--white);
  border-bottom: 2px solid var(--plum-opaque);
  position: sticky;
  top: 0;
  z-index: 5;
}

.staff-header .name {
  font-weight: 700;
  font-size: 14px;
  color: var(--plum);
}

.staff-header .role {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gold-dark);
}

/* LINEA DEL TEMPO CORRENTE (TIME INDICATOR) */
.current-time-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background-color: #ff4d6d;
  z-index: 8;
  pointer-events: none;
}
.current-time-line::before {
  content: '';
  position: absolute;
  left: 0;
  top: -4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: #ff4d6d;
}

/* ==========================================================================
   TESSERE DEGLI APPUNTAMENTI (CARD DESIGN)
   ========================================================================== */
.appointment-card {
  position: absolute;
  left: 4px;
  right: 4px;
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  font-size: 12px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.04);
  border-left: 4px solid var(--plum);
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.appointment-card:active {
  transform: scale(0.97);
}

/* Stati colorati eleganti */
.appointment-card.status-booked {
  background: #fdf0f1;
  border-left-color: var(--rose);
  color: #7a4b50;
}
.appointment-card.status-confirmed {
  background: #e6f4ea;
  border-left-color: #34a853;
  color: #137333;
}
.appointment-card.status-completed {
  background: #f1f3f4;
  border-left-color: #9aa0a6;
  color: #3c4043;
  opacity: 0.75;
}

.appointment-card .client-name {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.appointment-card .service-name {
  font-size: 11px;
  opacity: 0.9;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.appointment-card .time-range {
  font-size: 10px;
  font-weight: 600;
  margin-top: auto;
  opacity: 0.8;
}

/* Blocchi di chiusura / Jolly */
.block-card {
  position: absolute;
  left: 2px;
  right: 2px;
  background: repeating-linear-gradient(
    45deg,
    rgba(232, 197, 200, 0.15),
    rgba(232, 197, 200, 0.15) 10px,
    rgba(232, 197, 200, 0.25) 10px,
    rgba(232, 197, 200, 0.25) 20px
  );
  border: 1px dashed var(--rose);
  border-radius: var(--radius-sm);
  color: #7a4b50;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4px;
  cursor: pointer;
}

/* ==========================================================================
   SCHEDE CLIENTE E LISTE (SERVIZI/PANNELLI)
   ========================================================================== */
.view-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.view-title-row h2 {
  font-family: var(--font-serif);
  font-size: 24px;
  color: var(--plum);
}

.search-bar {
  background: var(--white);
  border: 1px solid var(--plum-opaque);
  padding: 12px 16px;
  border-radius: var(--radius-md);
  width: 100%;
  font-family: var(--font-sans);
  font-size: 14px;
  margin-bottom: 20px;
  outline: none;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.search-bar:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.15);
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.data-card {
  background: var(--white);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(61, 26, 46, 0.02);
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  transition: var(--transition);
}

.data-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.data-card h3 {
  font-size: 16px;
  color: var(--plum);
  font-weight: 700;
}

.data-card p {
  font-size: 13px;
  color: var(--text-muted);
  word-break: break-word; /* FIX PUNTO 4: Evita rotture layout */
}

.data-card .actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 12px;
  border-top: 1px solid var(--plum-opaque);
  padding-top: 12px;
}

.btn-action {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  transition: var(--transition);
}
.btn-action:hover {
  transform: scale(1.15);
}

/* ==========================================================================
   FINESTRE DI DIALOGO (MODAL MODERNI STILE APPLE)
   ========================================================================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(44, 24, 36, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 200;
  display: flex;
  align-items: flex-end; /* Su mobile si apre dal basso */
  justify-content: center;
  animation: fadeIn 0.25s ease-out;
}

.modal-window {
  background: var(--white);
  width: 100%;
  max-width: 500px;
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  box-shadow: var(--shadow-lg);
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (min-width: 576px) {
  .modal-overlay {
    align-items: center; /* Su tablet/desktop è centrato */
  }
  .modal-window {
    border-radius: var(--radius-lg);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h3 {
  font-family: var(--font-serif);
  font-size: 20px;
  color: var(--plum);
}

/* FORM ELEMENTI STILIZZATI */
.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--cream);
  border: 1px solid transparent;
  padding: 12px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 14px;
  color: var(--text-dark);
  outline: none;
  transition: var(--transition);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--gold);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.1);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 24px;
}

/* ANIMAZIONI CSS */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

/* Utilities */
.text-gold { color: var(--gold-dark); }
.fw-bold { font-weight: 700; }
.d-none { display: none !important; }
</style>
